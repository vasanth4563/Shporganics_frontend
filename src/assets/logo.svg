<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 660" fill="none">
  <!-- SHP Organics Brand Logo Emblem -->
  
  <!-- Stylized 3-Petal Leaf Icon at top -->
  <g id="leaf-icon">
    <!-- Center Leaf -->
    <path 
      d="M 250 90 
         C 185 160 185 240 250 270 
         C 315 240 315 160 250 90 Z" 
      stroke="#22C55E" 
      stroke-width="15" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none"
    />
    
    <!-- Left Leaf Petal & Inner V -->
    <path 
      d="M 250 270 
         C 200 240 180 180 205 150 
         C 150 170 120 220 135 270 
         C 160 310 215 320 250 310" 
      stroke="#22C55E" 
      stroke-width="15" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none"
    />
    
    <!-- Right Leaf Petal & Inner V -->
    <path 
      d="M 250 270 
         C 300 240 320 180 295 150 
         C 350 170 380 220 365 270 
         C 340 310 285 320 250 310" 
      stroke="#22C55E" 
      stroke-width="15" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none"
    />

    <!-- Bottom connecting cradle curve -->
    <path 
      d="M 135 270 
         C 165 315 205 325 250 325 
         C 295 325 335 315 365 270" 
      stroke="#22C55E" 
      stroke-width="15" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      fill="none"
    />
  </g>

  <!-- Bold SHP Wordmark -->
  <g id="shp-text" fill="#000000">
    <!-- S -->
    <path d="M 90 415 C 90 375 115 352 152 352 C 190 352 215 375 215 412 L 178 412 C 178 392 167 382 152 382 C 134 382 125 392 125 410 C 125 442 215 430 215 480 C 215 518 188 540 152 540 C 112 540 90 515 90 475 L 127 475 C 127 498 138 510 152 510 C 170 510 178 498 178 480 C 178 448 90 458 90 415 Z" />
    
    <!-- H -->
    <path d="M 235 355 L 268 355 L 268 425 L 322 425 L 322 355 L 355 355 L 355 537 L 322 537 L 322 457 L 268 457 L 268 537 L 235 537 Z" />
    
    <!-- P -->
    <path d="M 375 355 L 430 355 C 465 355 490 375 490 410 C 490 445 465 465 430 465 L 408 465 L 408 537 L 375 537 Z M 408 435 L 430 435 C 448 435 457 425 457 410 C 457 395 448 385 430 385 L 408 385 Z" />
  </g>

  <!-- Sprout leaves on bottom-right of P -->
  <g id="sprout" fill="#22C55E">
    <!-- Left Sprout Leaf -->
    <path d="M 438 522 C 428 504 440 492 458 496 C 465 510 455 525 438 522 Z" />
    <!-- Right Sprout Leaf -->
    <path d="M 460 522 C 465 506 482 498 494 506 C 493 524 477 529 460 522 Z" />
    <!-- Center white vein -->
    <path d="M 448 518 C 455 512 468 510 480 511" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- ORGANICS Tracking Subtitle -->
  <text 
    x="250" 
    y="605" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" 
    font-weight="800" 
    font-size="34" 
    fill="#000000" 
    letter-spacing="18"
  >
    ORGANICS
  </text>
</svg>
